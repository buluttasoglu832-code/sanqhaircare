<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SANQ Premium Care</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#0a0a0a;
color:white;
}

.hero{
min-height:100vh;
display:flex;
align-items:center;
justify-content:space-between;
padding:60px 10%;
background:
radial-gradient(circle at 20% 20%, rgba(255,193,7,0.20), transparent 30%),
radial-gradient(circle at 80% 40%, rgba(255,193,7,0.10), transparent 30%),
#0a0a0a;
}

.hero-text{
max-width:600px;
}

.hero-text h1{
font-size:80px;
margin-bottom:15px;
}

.hero-text h2{
color:#FFC107;
margin-bottom:20px;
}

.hero-text p{
font-size:20px;
line-height:1.8;
color:#d6d6d6;
}

.btn{
display:inline-block;
margin-top:30px;
padding:15px 35px;
background:#FFC107;
color:black;
text-decoration:none;
font-weight:bold;
border-radius:50px;
}

.hero-image img{
width:450px;
max-width:100%;
border-radius:25px;
box-shadow:0 0 30px rgba(255,193,7,.4);
}

@media(max-width:900px){

.hero{
flex-direction:column;
text-align:center;
padding-top:40px;
}

.hero-text h1{
font-size:55px;
}

.hero-image{
margin-top:40px;
}

}

</style>

</head>

<body>

</p>

</html>
